<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>.luzc{transform-box:fill-box;transform-origin:center;animation:lat .35s ease-in-out infinite alternate}@keyframes lat{from{transform:scale(.88);opacity:.75}to{transform:scale(1.1);opacity:1}}.rayos{stroke-dasharray:10 7;animation:fluir .3s linear infinite}@keyframes fluir{to{stroke-dashoffset:-34}}.estrella{transform-box:fill-box;transform-origin:center;animation:est .28s ease-in-out infinite alternate}@keyframes est{from{transform:scale(.7) rotate(0)}to{transform:scale(1.35) rotate(40deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="pintura" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
