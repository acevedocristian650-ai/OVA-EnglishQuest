<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <title>Mapa del Reino del Conocimiento</title>
  <desc>Un camino dorado une un bosque, un puente sobre el río, una torre y la puerta de la ciudad amurallada.</desc>
<style>
.oleaje{animation:oleaje var(--t,5s) ease-in-out var(--d,0s) infinite alternate}
@keyframes oleaje{from{transform:translate(-7px,2px)}to{transform:translate(8px,-3px)}}
.camino{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
.corriente{stroke-dasharray:3 17;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.bandera{transform-box:fill-box;transform-origin:0 50%;animation:ondea 1.3s ease-in-out var(--d,0s) infinite alternate}
@keyframes ondea{from{transform:skewY(-7deg) scaleX(1)}to{transform:skewY(7deg) scaleX(.86)}}
.sombra-nube{animation:nube var(--t) linear var(--d) infinite}
@keyframes nube{from{transform:translateX(-380px)}to{transform:translateX(1380px)}}
.brillo{animation:brillo var(--t) ease-in-out var(--d) infinite}
@keyframes brillo{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
.aguja{transform-box:fill-box;transform-origin:center;animation:aguja 6s ease-in-out infinite alternate}
@keyframes aguja{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
