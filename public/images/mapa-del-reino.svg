      <stop offset="1" stop-color="#101a31"/>
    </radialGradient>
    <linearGradient id="tierra" x2="0.85" y2="1">
      <stop stop-color="#385c55"/>
      <stop offset=".52" stop-color="#416957"/>
      <stop offset="1" stop-color="#263f46"/>
    </linearGradient>
    <linearGradient id="agua" x2="1" y2="1">
      <stop stop-color="#315b69"/>
      <stop offset="1" stop-color="#478290"/>
    </linearGradient>
    <path id="isla" d="M90 411C80 364 118 351 133 306C151 250 126 215 170 184C197 165 230 176 255 140C284 98 329 69 387 80C429 88 471 63 519 80C552 91 570 121 607 113C654 102 671 62 725 59C782 56 793 87 846 100C901 113 927 145 915 194C907 230 881 250 906 299C928 342 947 374 919 425C900 459 921 504 878 536C843 562 800 549 769 570C735 593 688 605 650 580C606 551 573 576 533 564C482 549 466 518 421 532C382 544 370 585 325 586C277 587 262 565 222 569C183 573 147 543 149 507C152 470 99 456 90 411Z"/>
